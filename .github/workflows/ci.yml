name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: lint (gofmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # gofmt -s: enforce the standard formatting + simplifications. Fails
      # with the list of offending files so the fix is obvious (gofmt -s -w .).
      # No deadcode gate here: cru is an imported library, so deadcode's
      # "unreachable from main" would false-positive on legit public API.
      # The 100% coverage gate below already proves there's no dead code.
      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need 'gofmt -s -w':"
            echo "$unformatted"
            exit 1
          fi

  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Explicit floor-to-current coverage (1.21 is the go.mod floor, 1.26
        # is current latest), plus `stable` so the matrix auto-picks up new
        # Go releases without a config edit. When 1.27 drops, `stable` will
        # cover it; the explicit list is only for older majors Go itself
        # no longer supports but we still want to keep working.
        go: ["1.21", "1.22", "1.23", "1.24", "1.25", "1.26", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  coverage:
    name: coverage (100% library)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # Coverage is enforced on the library itself, not on cmd/cru.
      # The CLI is a thin wrapper around the library; its main() and
      # interface-sealing methods are untestable without contortions.
      # The library is where calibration correctness lives.
      - run: go test -coverprofile=cover.out github.com/laserlemon/cru
      - name: enforce 100% statement coverage
        run: |
          total=$(go tool cover -func=cover.out | awk '/^total:/ {print $3}')
          echo "total coverage: $total"
          if [ "$total" != "100.0%" ]; then
            echo "::error::coverage $total fell below the required 100.0% bar"
            exit 1
          fi
